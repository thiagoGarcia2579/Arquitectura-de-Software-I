openapi: 3.0.3
info:
  title: API de Inspecciones de Obra
  version: 1.0.0
  description: |
    Inspecciones de obra municipales (Dominio 2B · municipio extenso).
    Todo entra por el gateway (`http://localhost:8000`).

    **Cómo probar en Swagger UI:** Tocá Authorize, dejá vacío el client_secret y logueate con un usuario de prueba (inspector1, supervisor1, admin1). Para cerrar sesión, ingresa a la siguiente página http://localhost:8180/realms/inspecciones/protocol/openid-connect/logout .
    
    **Versionado.** La versión mayor va en la URL: `/api/v1`. Los cambios compatibles (por ejemplo, un
    campo opcional nuevo) no cambian la versión. Un cambio incompatible crea `/v2` y `/v1` convive un
    tiempo con aviso de baja (headers `Deprecation` y `Sunset`), porque los celulares no se actualizan
    todos a la vez. Una ruta sin versión devuelve 404.

servers:
  - url: http://localhost:8000
    description: Gateway (vista desde tu navegador)
tags:
  - name: Inspecciones
  - name: Actas
  - name: Sincronización
paths:

  /api/v1/inspecciones:
    get:
      tags: [Inspecciones]
      summary: Listar inspecciones
      description: "**Roles:** inspector (solo las suyas), supervisor y administrativo (todas)."
      operationId: listarInspecciones
      security: [{ keycloak: [openid] }]
      responses:
        '200':
          description: Lista de inspecciones
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Inspeccion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /api/v1/inspecciones/{id}/asignacion:
    patch:
      tags: [Inspecciones]
      summary: Asignar o reasignar una inspección
      description: "**Rol requerido:** supervisor."
      operationId: asignarInspeccion
      security: [{ keycloak: [openid] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: aaaaaaaa-0000-0000-0000-000000000001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inspectorId]
              properties:
                inspectorId: { type: string, format: uuid }
            example: { inspectorId: '22222222-2222-2222-2222-222222222222' }
      responses:
        '200':
          description: Inspección actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inspeccion' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /api/v1/actas:
    get:
      tags: [Actas]
      summary: Listar actas
      description: "**Roles:** inspector (solo las suyas), supervisor y administrativo (todas)."
      operationId: listarActas
      security: [{ keycloak: [openid] }]
      responses:
        '200':
          description: Lista de actas (máx. 100, más recientes primero)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Acta' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }

  /api/v1/actas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: UUID generado por el celular
        schema: { type: string, format: uuid }
        example: bbbbbbbb-0000-0000-0000-000000000001
    put:
      tags: [Actas]
      summary: Cargar un acta cerrada (idempotente)
      description: |
        **Rol requerido:** inspector (sobre sus propias inspecciones).
        
        El id lo genera el celular, así que un reintento tras un corte de señal **no duplica** el acta:
        responde `200` con el acta ya existente. El acta cerrada no se modifica.
        Solo el inspector al que está asignada la inspección puede cargarla (regla fina).
        La asociación al expediente es **asíncrona**: el acta queda `pendiente_asociacion`
        y el servicio de sincronización la envía al sistema municipal.
      operationId: cargarActa
      security: [{ keycloak: [openid] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActaNueva' }
            example:
              inspeccionId: aaaaaaaa-0000-0000-0000-000000000001
              observaciones: Obra sin cartel reglamentario. Medianera según plano.
              cantidadFotos: 6
              creadaEnDispositivo: '2025-10-28T14:32:00-03:00'
      responses:
        '201':
          description: Acta recibida
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acta' }
        '200':
          description: Reintento — el acta ya estaba recibida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acta' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '413': { $ref: '#/components/responses/CuerpoGrande' }
    get:
      tags: [Actas]
      summary: Consultar un acta y el estado de su asociación al expediente
      description: "**Roles:** inspector (solo la suya; una ajena responde 404), supervisor y administrativo."
      operationId: obtenerActa
      security: [{ keycloak: [openid] }]
      responses:
        '200':
          description: El acta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acta' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /api/v1/sync:
    post:
      tags: [Sincronización]
      summary: Sincronizar en un solo pedido las actas acumuladas sin conexión
      description: |
        **Rol requerido:** inspector.
        Hasta 50 actas por pedido; cada una devuelve su propio resultado.
      operationId: sincronizarActas
      security: [{ keycloak: [openid] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actas]
              properties:
                actas:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    allOf:
                      - type: object
                        required: [id]
                        properties:
                          id: { type: string, format: uuid }
                      - $ref: '#/components/schemas/ActaNueva'
            example:
              actas:
                - id: bbbbbbbb-0000-0000-0000-000000000002
                  inspeccionId: aaaaaaaa-0000-0000-0000-000000000001
                  observaciones: Acta cargada sin conexión.
                  cantidadFotos: 3
                - id: bbbbbbbb-0000-0000-0000-000000000003
                  inspeccionId: aaaaaaaa-0000-0000-0000-000000000003
                  observaciones: "Esta es de OTRO inspector, debe rechazarse."
      responses:
        '200':
          description: Resultado por acta
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultados:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, nullable: true }
                        http: { type: integer }
                        estado: { type: string, enum: [creada, ya_recibida, rechazada] }
                        detalle: { type: string }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '413': { $ref: '#/components/responses/CuerpoGrande' }

components:
  securitySchemes:
    keycloak:
      type: oauth2
      description: |
        OIDC con Keycloak. Flujo Authorization Code + PKCE (cliente público "swagger-ui").
        Discovery: http://localhost:8180/realms/inspecciones/.well-known/openid-configuration
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8180/realms/inspecciones/protocol/openid-connect/auth
          tokenUrl: http://localhost:8180/realms/inspecciones/protocol/openid-connect/token
          scopes:
            openid: Identidad del usuario (OIDC)
            profile: Nombre y usuario
  schemas:
    Inspeccion:
      type: object
      properties:
        id: { type: string, format: uuid }
        expedienteId: { type: string, example: EXP-2025-0001 }
        direccion: { type: string }
        inspectorId: { type: string, format: uuid, nullable: true }
        inspectorNombre: { type: string, nullable: true }
        creadaEn: { type: string, format: date-time }
      example:
        id: aaaaaaaa-0000-0000-0000-000000000001
        expedienteId: EXP-2025-0001
        direccion: Ruta 7 km 52, lote 14
        inspectorId: 11111111-1111-1111-1111-111111111111
        inspectorNombre: Ana Inspectora
        creadaEn: '2026-11-18T12:00:00Z'
    ActaNueva:
      type: object
      required: [inspeccionId]
      properties:
        inspeccionId: { type: string, format: uuid }
        observaciones: { type: string, maxLength: 5000 }
        cantidadFotos: { type: integer, minimum: 0, maximum: 20 }
        creadaEnDispositivo:
          type: string
          format: date-time
          nullable: true
          description: Fecha declarada por el celular (no es una fuente confiable)
    Acta:
      type: object
      properties:
        id: { type: string, format: uuid }
        inspeccionId: { type: string, format: uuid }
        inspectorId: { type: string, format: uuid }
        expedienteId: { type: string, example: EXP-2025-0001 }
        direccion: { type: string }
        observaciones: { type: string }
        cantidadFotos: { type: integer }
        estado: { type: string, enum: [pendiente_asociacion, asociada, error_asociacion] }
        creadaEnDispositivo: { type: string, format: date-time, nullable: true }
        recibidaEn: { type: string, format: date-time }
        asociadaEn: { type: string, format: date-time, nullable: true }
        detalleAsociacion: { type: string, nullable: true }
      example:
        id: bbbbbbbb-0000-0000-0000-000000000001
        inspeccionId: aaaaaaaa-0000-0000-0000-000000000001
        inspectorId: 11111111-1111-1111-1111-111111111111
        expedienteId: EXP-2025-0001
        direccion: Ruta 7 km 52, lote 14
        observaciones: Obra sin cartel reglamentario. Medianera según plano.
        cantidadFotos: 6
        estado: asociada
        creadaEnDispositivo: '2026-11-18T14:32:00-03:00'
        recibidaEn: '2026-11-18T17:35:10Z'
        asociadaEn: '2026-11-18T17:35:14Z'
        detalleAsociacion: OK
    ProblemDetails:
      description: Formato de error estándar (RFC 9457, tipo de contenido application/problem+json)
      type: object
      properties:
        type:
          type: string
          example: about:blank
          description: 'Tipo de problema. "about:blank" significa que alcanza con el código HTTP.'
        title:
          type: string
          description: Resumen corto del error.
        status:
          type: integer
          description: Código HTTP, repetido dentro del cuerpo.
        detail:
          type: string
          description: Explicación de este caso concreto.
        instance:
          type: string
          description: Ruta del pedido que originó el error.
  responses:
    Invalido:
      description: Datos de entrada inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Datos inválidos
            status: 400
            detail: 'El id del acta y "inspeccionId" deben ser UUID válidos.'
            instance: /api/v1/actas/abc
    NoAutenticado:
      description: Falta el token, es inválido o está vencido
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Token inválido
            status: 401
            detail: El token es inválido o está vencido.
            instance: /api/v1/actas
    Prohibido:
      description: El rol o la asignación no permiten la operación
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Prohibido
            status: 403
            detail: 'El rol "administrativo" no puede realizar esta operación.'
            instance: /api/v1/actas/bbbbbbbb-0000-0000-0000-000000000001
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Acta no encontrada
            status: 404
            detail: No existe el acta bbbbbbbb-0000-0000-0000-000000000001.
            instance: /api/v1/actas/bbbbbbbb-0000-0000-0000-000000000001
    Conflicto:
      description: Ya existe un acta con ese id, cargada por otro inspector
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Conflicto
            status: 409
            detail: Ya existe un acta con ese id.
            instance: /api/v1/actas/bbbbbbbb-0000-0000-0000-000000000001
    CuerpoGrande:
      description: El cuerpo supera el tamaño permitido (256 KB; 1 MB en `/sync`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
          example:
            type: about:blank
            title: Cuerpo demasiado grande
            status: 413
            detail: El cuerpo supera el tamaño permitido.
            instance: /api/v1/actas/bbbbbbbb-0000-0000-0000-000000000001
server {
  listen 80;

  # Resolver interno de Docker para que Nginx refresque las IPs si un contenedor se reinicia o conmuta
  resolver 127.0.0.11 valid=10s;

  # CORS: solo el origen de Swagger UI
  add_header Access-Control-Allow-Origin  "http://localhost:8080" always;
  add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;
  add_header Vary "Origin" always;

  client_max_body_size 1m;

  # --- API v1 ---
location /api/v1/ {
    if ($request_method = OPTIONS) { return 204; }
    set $upstream_api http://api:3000;
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass $upstream_api;
}

  # --- Versión inexistente o sin versión: error en formato Problem Details ---
  location /api/ {
    default_type application/problem+json;
    return 404 '{"type":"about:blank","title":"Versión no soportada","status":404,"detail":"Use el prefijo /api/v1/.","instance":"/api"}';
  }

  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
}
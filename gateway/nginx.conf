# Único punto de entrada. Enruta por prefijo, limita el login y resuelve CORS para Swagger UI.
# La validación del JWT y las reglas de rol/asignación las hace cada servicio (defensa en profundidad).

limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
  listen 80;

  # CORS: solo el origen de Swagger UI
  add_header Access-Control-Allow-Origin  "http://localhost:8080" always;
  add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
  add_header Access-Control-Allow-Headers "Content-Type,Authorization" always;
  add_header Vary "Origin" always;

  client_max_body_size 1m;

  location = /auth/login {
    if ($request_method = OPTIONS) { return 204; }
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://auth:4000/login;
  }

  location /auth/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth:4000/;
  }

  location /api/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://api:3000/;
  }

  location /mobile/ {
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://bff-inspector:3001/mobile/;
  }

  location = /health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
}

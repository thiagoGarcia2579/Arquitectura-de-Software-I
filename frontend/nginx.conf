server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mismo origen para el navegador: las llamadas a la API pasan por el gateway.
  location /api/    { proxy_pass http://gateway:80; }
  location = /health { proxy_pass http://gateway:80; }

  # SPA: cualquier ruta del front devuelve index.html
  location / { try_files $uri $uri/ /index.html; }
}
# TP Arquitectura de Software 1 — Dominio 2B · Inspecciones de obra (municipio extenso)
# Un solo comando levanta todo:   docker compose up -d --build
# No hace falta .env: todo tiene valores por defecto de DESARROLLO. Para cambiarlos, copiá
# .env.example a .env. En producción los secretos vendrían de un gestor de secretos.

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-inspecciones}
  DB_USER: ${DB_USER:-inspecciones}
  DB_PASSWORD: ${DB_PASSWORD:-cambiame-db-123}

services:

  # Base de datos. No publica puertos: solo la ven los servicios de la red "backend".
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-inspecciones}
      POSTGRES_USER: ${DB_USER:-inspecciones}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cambiame-db-123}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  # Proveedor de identidad OIDC. Modo desarrollo: el realm se importa desde ./keycloak.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend]

  # API de inspecciones y actas (valida el token con las claves públicas de Keycloak, roles y regla fina).
  api:
    build: ./api
    environment:
      <<: *db-env
      PORT: 3000
      JWKS_URL: http://keycloak:8080/realms/inspecciones/protocol/openid-connect/certs
      ISSUER: http://localhost:8180/realms/inspecciones
      AUDIENCE: inspecciones-api
    depends_on:
      db: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    networks: [backend]

  # Simulador del sistema municipal heredado (solo SOAP). Lo consume únicamente "sync".
  # MOCK_FALLO_PCT=0 para una demo sin errores; poné 30 para ver los reintentos.
  mock-expedientes:
    build: ./mock-expedientes
    environment:
      PORT: 4100
      MOCK_LATENCIA_MS: ${MOCK_LATENCIA_MS:-800}
      MOCK_FALLO_PCT: ${MOCK_FALLO_PCT:-0}
    networks: [backend]

  # Capa anticorrupción: lee el outbox y asocia las actas al expediente por SOAP, con reintentos.
  # 20 intentos con backoff de tope 5 min = ~73 minutos de tolerancia a una caída del sistema municipal.
  sync:
    build: ./sync
    environment:
      <<: *db-env
      SOAP_URL: http://mock-expedientes:4100/
      SYNC_MAX_INTENTOS: ${SYNC_MAX_INTENTOS:-20}
    depends_on:
      db: { condition: service_healthy }
      mock-expedientes: { condition: service_started }
    restart: unless-stopped
    networks: [backend]

  # Único punto de entrada al backend (http://localhost:8000).
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    restart: unless-stopped
    depends_on: [api]
    networks: [backend]

  # Cliente web (React + IndexedDB, offline-first) servido por nginx. Se abre en http://localhost:5173
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on: [gateway]
    networks: [backend]

  # Documentación generada desde el contrato OpenAPI (v1).
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      OAUTH_CLIENT_ID: swagger-ui
      OAUTH_USE_PKCE: "true"
      OAUTH_SCOPES: openid profile
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
    ports:
      - "8080:8080"

volumes:
  pgdata:

networks:
  backend: